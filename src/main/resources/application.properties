spring.application.name=Tour-Management
server.port=${SERVER_PORT:9090}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:1000/tour-management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:panha}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:panha}


# ===== Keycloak — Resource Server (ផ្ទៀងផ្ទាត់ JWT ដែលចូលមក) =====
# ដាក់ jwk-set-uri ជាមួយផង ដើម្បីកុំឲ្យ app បរាជ័យពេលចាប់ផ្តើម ប្រសិនបើ Keycloak មិនទាន់រត់។
# ត្រូវផ្គូផ្គងនឹង issuer (`iss`) ក្នុង token ជាដាច់ខាត — ក្នុង docker compose ត្រូវប្រើ hostname
# ដូចគ្នាទាំង browser និង backend ឃើញ (មើល KEYCLOAK_ISSUER_URI ក្នុង docker-compose.yml)។
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:1001/realms/tour-management}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:1001/realms/tour-management/protocol/openid-connect/certs}

# ===== Keycloak — Admin Client (បង្កើត user ពី backend) =====
# client-secret ត្រូវផ្តល់តាម environment variable — កុំ commit តម្លៃពិតចូល git។
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:1001}
keycloak.realm=${KEYCLOAK_REALM:tour-management}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:tour-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:b5ee09RwOqaoOkWa3eVwfBjOgpwv1Dz4}

# ===== Swagger UI =====
# រក្សា token ទុកពេល refresh ទំព័រ — បើមិនដូច្នេះទេ ត្រូវ Authorize ឡើងវិញរាល់ដង។
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.jdbc.bind=TRACE
