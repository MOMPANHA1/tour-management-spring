spring.application.name=Tour-Management
server.port=9090


spring.datasource.url=jdbc:postgresql://localhost:1000/tour-management
spring.datasource.username=panha
spring.datasource.password=panha


# ===== Keycloak — Resource Server (ផ្ទៀងផ្ទាត់ JWT ដែលចូលមក) =====
# ដាក់ jwk-set-uri ជាមួយផង ដើម្បីកុំឲ្យ app បរាជ័យពេលចាប់ផ្តើម ប្រសិនបើ Keycloak មិនទាន់រត់។
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1001/realms/tour-management
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1001/realms/tour-management/protocol/openid-connect/certs

# ===== Keycloak — Admin Client (បង្កើត user ពី backend) =====
# client-secret ត្រូវផ្តល់តាម environment variable — កុំ commit តម្លៃពិតចូល git។
keycloak.server-url=http://localhost:1001
keycloak.realm=tour-management
keycloak.client-id=tour-backend
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:b5ee09RwOqaoOkWa3eVwfBjOgpwv1Dz4}

# ===== Swagger UI =====
# រក្សា token ទុកពេល refresh ទំព័រ — បើមិនដូច្នេះទេ ត្រូវ Authorize ឡើងវិញរាល់ដង។
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.jdbc.bind=TRACE
